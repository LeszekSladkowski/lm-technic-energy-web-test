<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>L&M Technic Energy — V2 KROK 2 nagłówek</title>
<style>
:root{--gold:#c99325;--gold2:#f2c45c;--green:#39f06a;--text:#fff;--muted:#b7b7ad}
*{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--text);font-family:Arial,Helvetica,sans-serif}body{min-height:100vh}.page{width:min(100%,512px);margin:0 auto;background:#000;min-height:100vh;border-left:1px solid #171717;border-right:1px solid #171717}
.master-header{background:linear-gradient(180deg,#070907,#020302);border-bottom:1px solid rgba(201,147,37,.55);padding:14px 16px 10px}
.brandbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;min-height:78px}
.lm-logo{width:72px;height:72px;border:2px solid var(--gold2);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font-weight:900;font-size:25px;letter-spacing:.4px;box-shadow:0 0 18px rgba(218,164,48,.18),inset 0 0 14px rgba(218,164,48,.06)}
.brandname{font-weight:900;font-size:23px;line-height:1.02;letter-spacing:.45px;white-space:nowrap}.brandname .energy{color:var(--gold2)}
.shop-btn{height:50px;min-width:92px;border:1px solid var(--gold2);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--gold2);font-weight:900;font-size:13px;text-decoration:none;box-shadow:0 0 12px rgba(218,164,48,.08)}
.shop-dot{width:22px;height:22px;border-radius:50%;background:var(--green);color:#06240d;display:grid;place-items:center;font-weight:900;font-size:16px}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:7px}.nav a{text-align:center;text-decoration:none;color:#ddd;font-weight:800;font-size:10px;line-height:1;padding:10px 2px 8px;border-top:1px solid rgba(201,147,37,.10)}
.language-wrap{padding:18px 14px 20px;background:#000;border-bottom:1px solid rgba(201,147,37,.32)}
.language-shell{position:relative;border:1px solid rgba(221,167,48,.8);border-radius:18px;background:linear-gradient(180deg,#0b0e0b,#050605);padding:14px;box-shadow:inset 0 0 18px rgba(196,139,21,.05),0 0 14px rgba(196,139,21,.07)}
.language-row{display:grid;grid-template-columns:1fr;gap:12px}.label{font-size:18px;font-weight:900;letter-spacing:.8px;color:var(--gold2)}
.lang-btn{appearance:none;border:1px solid var(--gold);background:#0b0d0b;color:#fff;border-radius:14px;min-height:62px;padding:10px 16px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;font-weight:900;font-size:18px;box-shadow:0 0 12px rgba(201,147,37,.10);cursor:pointer}.lang-btn .flag{font-size:29px}.chev{color:var(--gold2);font-size:15px;transition:.18s transform}.open .chev{transform:rotate(180deg)}
.menu{position:absolute;z-index:50;left:10px;right:10px;top:calc(100% + 7px);display:none;background:rgba(7,9,7,.985);border:1px solid var(--gold);border-radius:14px;padding:7px;box-shadow:0 18px 45px rgba(0,0,0,.72),0 0 20px rgba(205,149,32,.12);max-height:56vh;overflow:auto}.open .menu{display:block}
.opt{width:100%;border:0;border-bottom:1px solid rgba(218,165,45,.16);background:transparent;color:#fff;padding:11px 10px;display:flex;align-items:center;gap:11px;text-align:left;font-size:14px;cursor:pointer;border-radius:9px}.opt:last-child{border-bottom:0}.opt:active,.opt:hover{background:linear-gradient(90deg,rgba(36,235,89,.12),rgba(211,153,31,.06))}.opt .flag{font-size:23px;width:30px}.opt strong{font-weight:800}.opt small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
@media(max-width:430px){.lm-logo{width:64px;height:64px;font-size:22px}.brandname{font-size:20px}.shop-btn{min-width:82px;height:46px}.master-header{padding-left:12px;padding-right:12px}.brandbar{gap:10px}}
@media(max-width:365px){.brandname{font-size:17px}.lm-logo{width:58px;height:58px}.shop-btn{min-width:74px;font-size:11px}.nav a{font-size:9px}}
</style>
</head>
<body>
<main class="page">
<header class="master-header">
  <div class="brandbar">
    <div class="lm-logo">L&amp;M</div>
    <div class="brandname">TECHNIC <span class="energy">ENERGY</span></div>
    <a class="shop-btn" href="#">SKLEP <span class="shop-dot">›</span></a>
  </div>
  <nav class="nav" aria-label="Menu główne">
    <a href="#">OFERTA</a><a href="#">PRODUKTY</a><a href="#">MAGAZYN</a><a href="#">LOGISTYKA</a><a href="#">KONTAKT</a>
  </nav>
</header>

<section class="language-wrap">
<section class="language-shell" id="langShell">
<div class="language-row">
<div class="label">JĘZYK / LANGUAGE</div>
<button class="lang-btn" id="langButton" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="flag" id="currentFlag">🇵🇱</span><span id="currentName">POLSKI</span><span class="chev">▼</span></button>
</div>
<div class="menu" id="langMenu" role="listbox" aria-label="Wybór języka">
<button class="opt" data-code="pl" data-flag="🇵🇱" data-name="POLSKI"><span class="flag">🇵🇱</span><span><strong>Polski</strong><small>Polska</small></span></button>
<button class="opt" data-code="de" data-flag="🇩🇪" data-name="DEUTSCH"><span class="flag">🇩🇪</span><span><strong>Deutsch</strong><small>Deutschland</small></span></button>
<button class="opt" data-code="cs" data-flag="🇨🇿" data-name="ČEŠTINA"><span class="flag">🇨🇿</span><span><strong>Čeština</strong><small>Česko</small></span></button>
<button class="opt" data-code="sk" data-flag="🇸🇰" data-name="SLOVENČINA"><span class="flag">🇸🇰</span><span><strong>Slovenčina</strong><small>Slovensko</small></span></button>
<button class="opt" data-code="de-AT" data-flag="🇦🇹" data-name="DEUTSCH (AT)"><span class="flag">🇦🇹</span><span><strong>Deutsch</strong><small>Österreich</small></span></button>
<button class="opt" data-code="de-CH" data-flag="🇨🇭" data-name="SCHWEIZ"><span class="flag">🇨🇭</span><span><strong>Deutsch / Français / Italiano</strong><small>Schweiz / Suisse / Svizzera</small></span></button>
<button class="opt" data-code="nl" data-flag="🇳🇱" data-name="NEDERLANDS"><span class="flag">🇳🇱</span><span><strong>Nederlands</strong><small>Nederland</small></span></button>
<button class="opt" data-code="be" data-flag="🇧🇪" data-name="BELGIË / BELGIQUE"><span class="flag">🇧🇪</span><span><strong>Nederlands / Français</strong><small>België / Belgique</small></span></button>
<button class="opt" data-code="lv" data-flag="🇱🇻" data-name="LATVIEŠU"><span class="flag">🇱🇻</span><span><strong>Latviešu</strong><small>Latvija</small></span></button>
<button class="opt" data-code="da" data-flag="🇩🇰" data-name="DANSK"><span class="flag">🇩🇰</span><span><strong>Dansk</strong><small>Danmark</small></span></button>
<button class="opt" data-code="en" data-flag="🇬🇧" data-name="ENGLISH"><span class="flag">🇬🇧</span><span><strong>English</strong><small>International</small></span></button>
</div>
</section>
</section>
</main>
<script>
(()=>{const shell=document.getElementById('langShell'),btn=document.getElementById('langButton'),flag=document.getElementById('currentFlag'),name=document.getElementById('currentName');function setOpen(v){shell.classList.toggle('open',v);btn.setAttribute('aria-expanded',String(v))}btn.addEventListener('click',e=>{e.stopPropagation();setOpen(!shell.classList.contains('open'))});document.querySelectorAll('.opt').forEach(o=>o.addEventListener('click',()=>{const x={code:o.dataset.code,flag:o.dataset.flag,name:o.dataset.name};flag.textContent=x.flag;name.textContent=x.name;document.documentElement.lang=x.code.split('-')[0];localStorage.setItem('lm-language',JSON.stringify(x));setOpen(false)}));document.addEventListener('click',e=>{if(!shell.contains(e.target))setOpen(false)});document.addEventListener('keydown',e=>{if(e.key==='Escape')setOpen(false)});try{const x=JSON.parse(localStorage.getItem('lm-language'));if(x&&x.flag&&x.name){flag.textContent=x.flag;name.textContent=x.name;document.documentElement.lang=(x.code||'pl').split('-')[0]}}catch(e){}})();
</script>
</body>
</html>
