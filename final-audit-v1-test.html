async function waitForContact(d,limit=80){
  for(let i=0;i<limit;i++){
    const el=d.getElementById('contact9');
    if(el)return el;
    await new Promise(r=>setTimeout(r,50));
  }
  return null;
}

async function install(){
  const w=frame.contentWindow,d=frame.contentDocument;
  if(!w||!d)throw new Error('iframe not ready');
  const old=await waitForContact(d);
  if(!old)throw new Error('contact9 not found');

  const host=d.createElement('section');
  host.id='contact9';
  host.setAttribute('aria-label','Kontakt i magazyn L&M Technic Energy — MASTER 009 V7B');
  const warehouseAnchor=d.createElement('span');
  warehouseAnchor.id='warehouse9';
  warehouseAnchor.style.cssText='display:block;position:relative;top:-6px;height:1px;width:1px;';
  old.replaceWith(warehouseAnchor,host);

  const shadow=host.attachShadow({mode:'open'});
  const localStyle=d.createElement('style');
  localStyle.textContent=':host{display:block;width:100%;max-width:100%;background:#000;padding:4px 14px 24px;box-sizing:border-box} @media(max-width:430px){:host{padding-left:9px;padding-right:9px}}';
  const link=d.createElement('link');

  link.href='assets/contact9-v7.css?v=20260907-final-audit-v2';
  const hidden=d.createElement('select');hidden.id='v6Lang';hidden.hidden=true;
  ['pl','de','cs','sk','de-AT','de-CH','nl','be','lv','da','en'].forEach(code=>{const o=d.createElement('option');o.value=code;o.textContent=code;hidden.appendChild(o)});
  const wrap=d.createElement('div');wrap.innerHTML=V7_MARKUP;
  shadow.append(localStyle,link,hidden,...wrap.childNodes);

  await new Promise((resolve,reject)=>{link.addEventListener('load',resolve,{once:true});link.addEventListener('error',reject,{once:true});setTimeout(resolve,1500)});

  let code=await fetch('assets/contact9-v6.js?v=20260907-final-audit-v2',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('language js '+r.status);return r.text()});
  code=code.replace("const $=id=>document.getElementById(id);","const $=id=>shadowRoot.getElementById(id);");
  new Function('shadowRoot',code)(shadow);

  const saved=(()=>{try{return JSON.parse(w.localStorage.getItem('lm-language')||'null')}catch(e){return null}})();
  if(saved&&saved.code){hidden.value=saved.code;hidden.dispatchEvent(new Event('change'))}
  d.querySelectorAll('.opt[data-code]').forEach(btn=>btn.addEventListener('click',()=>setTimeout(()=>{hidden.value=btn.dataset.code||'pl';hidden.dispatchEvent(new Event('change'))},0)));

  const product=d.querySelector('.product-master');if(product&&!product.id)product.id='products';
  const navOffer=d.getElementById('navOffer'),navProducts=d.getElementById('navProducts'),navStock=d.getElementById('navStock'),navLogistics=d.getElementById('navLogistics'),navContact=d.getElementById('navContact');

  const shop=d.querySelector('.shop-btn'),heroShop=d.getElementById('heroCta'),v7Store=shadow.getElementById('v6StoreBtn');
  const shopHref=shop?shop.getAttribute('href'):'#';if(heroShop&&shopHref)heroShop.href=shopHref;if(v7Store&&shopHref)v7Store.href=shopHref;

  d.documentElement.dataset.finalAudit='v2-master009-v7b';
