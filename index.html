<!doctype html>
<html lang="pl" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="google" content="notranslate">
<title>L&M Technic Energy</title>
<style>
:root{--gold:#c99325;--gold2:#f2c45c;--green:#39f06a;--text:#fff;--muted:#b7b7ad}
*{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--text);font-family:Arial,Helvetica,sans-serif}body{min-height:100vh}.page{width:min(100%,512px);margin:0 auto;background:#000;min-height:100vh;border-left:1px solid #171717;border-right:1px solid #171717}
.master-header{background:linear-gradient(180deg,#070907,#020302);border-bottom:1px solid rgba(201,147,37,.55);padding:14px 16px 10px}
.brandbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;min-height:78px}
.lm-logo{width:72px;height:72px;border:2px solid var(--gold2);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font-weight:900;font-size:25px;letter-spacing:.4px;box-shadow:0 0 18px rgba(218,164,48,.18),inset 0 0 14px rgba(218,164,48,.06)}
.brandname{font-weight:900;font-size:23px;line-height:1.02;letter-spacing:.45px;white-space:nowrap}.brandname .energy{color:var(--gold2)}
.shop-btn{height:50px;min-width:92px;border:1px solid var(--gold2);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--gold2);font-weight:900;font-size:13px;text-decoration:none;box-shadow:0 0 12px rgba(218,164,48,.08)}
.shop-dot{width:22px;height:22px;border-radius:50%;background:var(--green);color:#06240d;display:grid;place-items:center;font-weight:900;font-size:16px}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:7px}.nav a{text-align:center;text-decoration:none;color:#ddd;font-weight:800;font-size:10px;line-height:1;padding:10px 2px 8px;border-top:1px solid rgba(201,147,37,.10)}
.language-wrap{padding:18px 14px 20px;background:#000;border-bottom:1px solid rgba(201,147,37,.32)}
.language-shell{position:relative;border:1px solid rgba(221,167,48,.8);border-radius:18px;background:linear-gradient(180deg,#0b0e0b,#050605);padding:14px;box-shadow:inset 0 0 18px rgba(196,139,21,.05),0 0 14px rgba(196,139,21,.07)}
.language-row{display:grid;grid-template-columns:1fr;gap:12px}.label{font-size:18px;font-weight:900;letter-spacing:.8px;color:var(--gold2)}
.lang-btn{appearance:none;border:1px solid var(--gold);background:#0b0d0b;color:#fff;border-radius:14px;min-height:62px;padding:10px 16px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;font-weight:900;font-size:18px;box-shadow:0 0 12px rgba(201,147,37,.10);cursor:pointer}.lang-btn .flag{font-size:29px}.chev{color:var(--gold2);font-size:15px;transition:.18s transform}.open .chev{transform:rotate(180deg)}
.menu{position:absolute;z-index:50;left:10px;right:10px;top:calc(100% + 7px);display:none;background:rgba(7,9,7,.985);border:1px solid var(--gold);border-radius:14px;padding:7px;box-shadow:0 18px 45px rgba(0,0,0,.72),0 0 20px rgba(205,149,32,.12);max-height:56vh;overflow:auto}.open .menu{display:block}
.opt{width:100%;border:0;border-bottom:1px solid rgba(218,165,45,.16);background:transparent;color:#fff;padding:11px 10px;display:flex;align-items:center;gap:11px;text-align:left;font-size:14px;cursor:pointer;border-radius:9px}.opt:last-child{border-bottom:0}.opt:active,.opt:hover{background:linear-gradient(90deg,rgba(36,235,89,.12),rgba(211,153,31,.06))}.opt .flag{font-size:23px;width:30px}.opt strong{font-weight:800}.opt small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.hero-master{padding:18px 14px 24px;background:#000;border-bottom:1px solid rgba(201,147,37,.24)}
.hero-card{overflow:hidden;border:1px solid rgba(221,167,48,.82);border-radius:18px;background:linear-gradient(180deg,#071008,#020302);box-shadow:0 0 18px rgba(196,139,21,.08)}
.hero-visual{width:100%;aspect-ratio:512/190;overflow:hidden;background:#061008}
.hero-visual img{display:block;width:100%;height:auto;margin:0;border:0;border-radius:0}
.hero-copy{position:relative;text-align:center;padding:10px 16px 17px;background:radial-gradient(circle at 50% 0%,rgba(20,86,25,.34),rgba(3,7,3,.96) 66%)}
.hero-title{margin:0;color:#52c727;font-size:24px;line-height:1.04;font-weight:900;letter-spacing:.4px;text-shadow:0 0 11px rgba(64,216,51,.16)}
.hero-subtitle{margin:7px 0 13px;color:#eee;font-size:13px;line-height:1.25;font-weight:500}
.hero-cta{display:flex;align-items:center;justify-content:center;gap:8px;width:min(100%,320px);min-height:44px;margin:0 auto;padding:10px 15px;border:0;border-radius:8px;background:linear-gradient(180deg,#39ef69,#20c952);color:#031b09;text-decoration:none;font-size:14px;line-height:1.05;font-weight:900;box-shadow:0 0 14px rgba(52,235,103,.25)}
.hero-cta .cta-arrow{font-size:19px;line-height:1}
.product-master{padding:4px 14px 24px;background:#000;border-bottom:1px solid rgba(201,147,37,.24)}
.product-card{overflow:hidden;display:grid;grid-template-columns:42% 58%;min-height:184px;border:1px solid rgba(221,167,48,.82);border-radius:18px;background:linear-gradient(110deg,#080a07 0%,#060806 42%,#071108 100%);box-shadow:0 0 18px rgba(196,139,21,.08)}
.product-copy{padding:20px 8px 18px 18px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2}
.product-title{margin:0;color:#fff;font-size:18px;line-height:1.03;font-weight:900;letter-spacing:.4px}
.product-premium{margin:3px 0 0;color:#57c72b;font-size:19px;line-height:1.03;font-weight:900;letter-spacing:.5px}
.product-line{width:86%;height:1px;margin:12px 0 10px;background:linear-gradient(90deg,var(--gold2),rgba(242,196,92,.12))}
.product-spec{margin:0;color:#d8d8d1;font-size:12px;line-height:1.35;font-weight:600}
.product-visual{min-width:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 45% 50%,rgba(26,73,24,.32),transparent 70%)}
.product-visual img{display:block;width:100%;height:100%;max-height:184px;object-fit:contain;object-position:center}
.offer-master{padding:4px 14px 26px;background:#000;border-bottom:1px solid rgba(201,147,37,.24)}
.offer-frame{border:1px solid rgba(221,167,48,.82);border-radius:18px;background:linear-gradient(180deg,#080b08,#020302);padding:10px;box-shadow:0 0 18px rgba(196,139,21,.08)}
.offer-heading{margin:0 2px 10px;text-align:center;color:#f1f1ec;font-size:15px;line-height:1.12;font-weight:900;letter-spacing:.45px;text-transform:uppercase}.offer-heading .accent{color:var(--gold2)}
.offer-master-image{display:block;width:100%;height:auto;aspect-ratio:3/1;object-fit:contain;object-position:center;border:0;margin:0;border-radius:10px;background:#000}
@media(max-width:430px){.lm-logo{width:64px;height:64px;font-size:22px}.brandname{font-size:20px}.shop-btn{min-width:82px;height:46px}.master-header{padding-left:12px;padding-right:12px}.brandbar{gap:10px}.hero-title{font-size:22px}.hero-subtitle{font-size:12px}.hero-cta{font-size:13px}.product-title{font-size:17px}.product-premium{font-size:18px}.product-spec{font-size:11px}.offer-heading{font-size:14px}}
@media(max-width:365px){.brandname{font-size:17px}.lm-logo{width:58px;height:58px}.shop-btn{min-width:74px;font-size:11px}.nav a{font-size:9px}.hero-title{font-size:19px}.hero-cta{font-size:12px}.product-card{grid-template-columns:44% 56%;min-height:164px}.product-visual img{max-height:164px}.product-copy{padding-left:14px}.product-title{font-size:15px}.product-premium{font-size:16px}.product-spec{font-size:10px}.offer-heading{font-size:13px}}
</style>
</head>
<body>
<main class="page">
<header class="master-header">
  <div class="brandbar">
    <div class="lm-logo">L&amp;M</div>
    <div class="brandname">TECHNIC <span class="energy">ENERGY</span></div>
    <a class="shop-btn" href="#">SKLEP <span class="shop-dot">›</span></a>
  </div>
  <nav class="nav" aria-label="Menu główne">
    <a href="#">OFERTA</a><a href="#">PRODUKTY</a><a href="#">MAGAZYN</a><a href="#">LOGISTYKA</a><a href="#">KONTAKT</a>
  </nav>
</header>
<section class="language-wrap"><section class="language-shell" id="langShell"><div class="language-row"><div class="label">JĘZYK / LANGUAGE</div><button class="lang-btn" id="langButton" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="flag" id="currentFlag">🇵🇱</span><span id="currentName">POLSKI</span><span class="chev">▼</span></button></div><div class="menu" id="langMenu" role="listbox" aria-label="Wybór języka">
<button class="opt" data-code="pl" data-flag="🇵🇱" data-name="POLSKI"><span class="flag">🇵🇱</span><span><strong>Polski</strong><small>Polska</small></span></button>
<button class="opt" data-code="de" data-flag="🇩🇪" data-name="DEUTSCH"><span class="flag">🇩🇪</span><span><strong>Deutsch</strong><small>Deutschland</small></span></button>
<button class="opt" data-code="cs" data-flag="🇨🇿" data-name="ČEŠTINA"><span class="flag">🇨🇿</span><span><strong>Čeština</strong><small>Česko</small></span></button>
<button class="opt" data-code="sk" data-flag="🇸🇰" data-name="SLOVENČINA"><span class="flag">🇸🇰</span><span><strong>Slovenčina</strong><small>Slovensko</small></span></button>
<button class="opt" data-code="de-AT" data-flag="🇦🇹" data-name="DEUTSCH (AT)"><span class="flag">🇦🇹</span><span><strong>Deutsch</strong><small>Österreich</small></span></button>
<button class="opt" data-code="de-CH" data-flag="🇨🇭" data-name="SCHWEIZ"><span class="flag">🇨🇭</span><span><strong>Deutsch / Français / Italiano</strong><small>Schweiz / Suisse / Svizzera</small></span></button>
<button class="opt" data-code="nl" data-flag="🇳🇱" data-name="NEDERLANDS"><span class="flag">🇳🇱</span><span><strong>Nederlands</strong><small>Nederland</small></span></button>
<button class="opt" data-code="be" data-flag="🇧🇪" data-name="BELGIË / BELGIQUE"><span class="flag">🇧🇪</span><span><strong>Nederlands / Français</strong><small>België / Belgique</small></span></button>
<button class="opt" data-code="lv" data-flag="🇱🇻" data-name="LATVIEŠU"><span class="flag">🇱🇻</span><span><strong>Latviešu</strong><small>Latvija</small></span></button>
<button class="opt" data-code="da" data-flag="🇩🇰" data-name="DANSK"><span class="flag">🇩🇰</span><span><strong>Dansk</strong><small>Danmark</small></span></button>
<button class="opt" data-code="en" data-flag="🇬🇧" data-name="ENGLISH"><span class="flag">🇬🇧</span><span><strong>English</strong><small>International</small></span></button>
</div></section></section>
<section class="hero-master" aria-label="L&M Technic Energy — HERO LIVE"><div class="hero-card"><div class="hero-visual"><img src="assets/HERO_MASTER_LM_TECHNIC_ENERGY.png" alt="L&M Technic Energy Premium"></div><div class="hero-copy"><h1 class="hero-title" id="heroTitle">ENERGIA NATURY</h1><p class="hero-subtitle" id="heroSubtitle">Pellet Premium A1 dla domu i biznesu</p><a class="hero-cta" id="heroCta" href="../"><span id="heroCtaText">PRZEJDŹ DO SKLEPU</span><span class="cta-arrow">›</span></a></div></div></section>
<section class="product-master" aria-label="Pellet drzewny Premium A1"><div class="product-card"><div class="product-copy"><h2 class="product-title" id="productTitle">PELLET DRZEWNY</h2><p class="product-premium" id="productPremium">PREMIUM A1</p><div class="product-line" aria-hidden="true"></div><p class="product-spec" id="productSpec">68 worków × 15 kg • 1 020 kg</p></div><div class="product-visual"><img src="PELLET_MASTER_PRODUCT.jpg" alt="Paleta pelletu L&M Technic Energy Premium A1"></div></div></section>
<section class="offer-master" id="offer" aria-label="Oferta dopasowana do potrzeb"><div class="offer-frame"><h2 class="offer-heading"><span id="offerHeadA">OFERTA DOPASOWANA DO TWOICH</span> <span class="accent" id="offerHeadB">POTRZEB</span></h2><img class="offer-master-image" src="assets/OFFER_BAGS_15KG_MASTER_2026-09-05.jpg" alt="WORKI 15 KG — L&M Technic Energy Pellet Premium A1"></div></section>
<!-- BUILD ROOT: kolejne kafle instalowane wyłącznie po zatwierdzeniu 1:1 według MASTER MAPY 2026-09-05 -->
<div id="buildRoot"></div>
</main>
<script>
(()=>{
const shell=document.getElementById('langShell'),btn=document.getElementById('langButton'),flag=document.getElementById('currentFlag'),name=document.getElementById('currentName');
const heroTitle=document.getElementById('heroTitle'),heroSubtitle=document.getElementById('heroSubtitle'),heroCtaText=document.getElementById('heroCtaText');
const productTitle=document.getElementById('productTitle'),productPremium=document.getElementById('productPremium'),productSpec=document.getElementById('productSpec');
const offerHeadA=document.getElementById('offerHeadA'),offerHeadB=document.getElementById('offerHeadB');
const heroCopy={pl:{title:'ENERGIA NATURY',sub:'Pellet Premium A1 dla domu i biznesu',cta:'PRZEJDŹ DO SKLEPU'},de:{title:'ENERGIE DER NATUR',sub:'Premium A1 Holzpellets für Haus und Gewerbe',cta:'ZUM SHOP'},cs:{title:'ENERGIE Z PŘÍRODY',sub:'Prémiové pelety A1 pro domácnosti a firmy',cta:'PŘEJÍT DO OBCHODU'},sk:{title:'ENERGIA Z PRÍRODY',sub:'Prémiové pelety A1 pre domácnosti a firmy',cta:'PREJSŤ DO OBCHODU'},'de-AT':{title:'ENERGIE DER NATUR',sub:'Premium A1 Holzpellets für Haus und Gewerbe',cta:'ZUM SHOP'},'de-CH':{title:'ENERGIE AUS DER NATUR',sub:'Premium A1 Holzpellets für Haus und Gewerbe',cta:'ZUM SHOP'},nl:{title:'ENERGIE UIT DE NATUUR',sub:'Premium A1-pellets voor thuis en bedrijven',cta:'NAAR DE WINKEL'},be:{title:'ENERGIE UIT DE NATUUR',sub:'Premium A1-pellets voor thuis en bedrijven',cta:'NAAR DE WINKEL'},lv:{title:'DABAS ENERĢIJA',sub:'Premium A1 granulas mājām un uzņēmumiem',cta:'UZ VEIKALU'},da:{title:'ENERGI FRA NATUREN',sub:'Premium A1-træpiller til hjem og erhverv',cta:'GÅ TIL BUTIKKEN'},en:{title:'ENERGY FROM NATURE',sub:'Premium A1 wood pellets for home and business',cta:'GO TO SHOP'}};
const productCopy={pl:{title:'PELLET DRZEWNY',premium:'PREMIUM A1',spec:'68 worków × 15 kg • 1 020 kg'},de:{title:'HOLZPELLETS',premium:'PREMIUM A1',spec:'68 Säcke × 15 kg • 1 020 kg'},cs:{title:'DŘEVĚNÉ PELETY',premium:'PREMIUM A1',spec:'68 pytlů × 15 kg • 1 020 kg'},sk:{title:'DREVENÉ PELETY',premium:'PREMIUM A1',spec:'68 vriec × 15 kg • 1 020 kg'},'de-AT':{title:'HOLZPELLETS',premium:'PREMIUM A1',spec:'68 Säcke × 15 kg • 1 020 kg'},'de-CH':{title:'HOLZPELLETS',premium:'PREMIUM A1',spec:'68 Säcke × 15 kg • 1 020 kg'},nl:{title:'HOUTPELLETS',premium:'PREMIUM A1',spec:'68 zakken × 15 kg • 1 020 kg'},be:{title:'HOUTPELLETS',premium:'PREMIUM A1',spec:'68 zakken × 15 kg • 1 020 kg'},lv:{title:'KOKSNES GRANULAS',premium:'PREMIUM A1',spec:'68 maisi × 15 kg • 1 020 kg'},da:{title:'TRÆPILLER',premium:'PREMIUM A1',spec:'68 sække × 15 kg • 1 020 kg'},en:{title:'WOOD PELLETS',premium:'PREMIUM A1',spec:'68 bags × 15 kg • 1,020 kg'}};
const offerCopy={pl:['OFERTA DOPASOWANA DO TWOICH','POTRZEB'],de:['ANGEBOT PASSEND ZU IHREN','BEDÜRFNISSEN'],cs:['NABÍDKA PŘIZPŮSOBENÁ VAŠIM','POTŘEBÁM'],sk:['PONUKA PRISPÔSOBENÁ VAŠIM','POTREBÁM'],'de-AT':['ANGEBOT PASSEND ZU IHREN','BEDÜRFNISSEN'],'de-CH':['ANGEBOT PASSEND ZU IHREN','BEDÜRFNISSEN'],nl:['AANBOD AFGESTEMD OP UW','BEHOEFTEN'],be:['AANBOD AFGESTEMD OP UW','BEHOEFTEN'],lv:['PIEDĀVĀJUMS PIELĀGOTS JŪSU','VAJADZĪBĀM'],da:['TILBUD TILPASSET DINE','BEHOV'],en:['AN OFFER TAILORED TO YOUR','NEEDS']};
function applyHero(code){const h=heroCopy[code]||heroCopy[(code||'pl').split('-')[0]]||heroCopy.pl;heroTitle.textContent=h.title;heroSubtitle.textContent=h.sub;heroCtaText.textContent=h.cta;const p=productCopy[code]||productCopy[(code||'pl').split('-')[0]]||productCopy.pl;productTitle.textContent=p.title;productPremium.textContent=p.premium;productSpec.textContent=p.spec;const o=offerCopy[code]||offerCopy[(code||'pl').split('-')[0]]||offerCopy.pl;offerHeadA.textContent=o[0];offerHeadB.textContent=o[1]}
function setOpen(v){shell.classList.toggle('open',v);btn.setAttribute('aria-expanded',String(v))}
btn.addEventListener('click',e=>{e.stopPropagation();setOpen(!shell.classList.contains('open'))});
document.querySelectorAll('.opt').forEach(o=>o.addEventListener('click',()=>{const x={code:o.dataset.code,flag:o.dataset.flag,name:o.dataset.name};flag.textContent=x.flag;name.textContent=x.name;document.documentElement.lang=x.code.split('-')[0];localStorage.setItem('lm-language',JSON.stringify(x));applyHero(x.code);setOpen(false)}));
document.addEventListener('click',e=>{if(!shell.contains(e.target))setOpen(false)});document.addEventListener('keydown',e=>{if(e.key==='Escape')setOpen(false)});
try{const x=JSON.parse(localStorage.getItem('lm-language'));if(x&&x.flag&&x.name){flag.textContent=x.flag;name.textContent=x.name;document.documentElement.lang=(x.code||'pl').split('-')[0];applyHero(x.code||'pl')}else{applyHero('pl')}}catch(e){applyHero('pl')}
})();
</script>
</body>
</html>
