name: Install OKNO 9 Kontakt LIVE

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.event.head_commit.message == 'BOOTSTRAP OKNO9'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install canonical clean asset
        run: |
          test -f assets/file_00000000c27081f48fb4ea21f98fe1a5.png
          test ! -e assets/OKNO_9_KONTAKT_MASTER_CLEAN.png
          mv assets/file_00000000c27081f48fb4ea21f98fe1a5.png assets/OKNO_9_KONTAKT_MASTER_CLEAN.png
      - name: Patch index surgically FORWARD ONLY
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '<!-- OKNO 9 CONTACT LIVE -->' in s:
              raise SystemExit('OKNO 9 already installed — abort duplicate')
          css=Path('.github/lm_tmp/okno9_css.txt').read_text(encoding='utf-8')
          html=Path('.github/lm_tmp/okno9_html.txt').read_text(encoding='utf-8')
          js=Path('.github/lm_tmp/okno9_js.txt').read_text(encoding='utf-8')
          if s.count('</style>') != 1: raise SystemExit('style anchor not unique')
          s=s.replace('</style>',css+'\n</style>',1)
          marker='<!-- BUILD ROOT: kolejne kafle instalowane wyłącznie po zatwierdzeniu 1:1 według MASTER MAPY 2026-09-05 --><div id="buildRoot"></div>'
          if s.count(marker) != 1: raise SystemExit('buildRoot anchor not unique')
          s=s.replace(marker,html+'\n'+marker,1)
          if s.count('</body>') != 1: raise SystemExit('body anchor not unique')
          s=s.replace('</body>',js+'\n</body>',1)
          required=['<!-- OKNO 9 CONTACT LIVE -->','assets/OKNO_9_KONTAKT_MASTER_CLEAN.png?v=20260906contact9master1','id="contact9"','id="warehouse9"','tel:+48723588333','tel:+48510108170','mailto:lmtechnic@wp.pl','Nawarzyce 103','ul. Fabryczna 3','9592065184','526276350','0001055885']
          for x in required:
              if x not in s: raise SystemExit('missing OKNO9 signature: '+x)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate HTML JavaScript and diff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if len(scripts) < 2: raise SystemExit('expected original + OKNO9 scripts')
          for i,code in enumerate(scripts): Path(f'/tmp/script{i}.js').write_text(code,encoding='utf-8')
          PY
          for f in /tmp/script*.js; do node --check "$f"; done
          git diff --check
          git diff -- index.html | grep -q 'OKNO 9 CONTACT LIVE'
          git diff --name-status
      - name: Commit OKNO 9 LIVE and clean installer
        run: |
          git config user.name "L&M Technic Energy Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/lm_tmp/okno9_css.txt .github/lm_tmp/okno9_html.txt .github/lm_tmp/okno9_js.txt .github/workflows/install-okno9.yml
          git add index.html assets/OKNO_9_KONTAKT_MASTER_CLEAN.png assets/file_00000000c27081f48fb4ea21f98fe1a5.png || true
          git commit -m "OKNO 9 — KONTAKT + MAGAZYN LIVE MULTILANGUAGE"
          git push origin main
