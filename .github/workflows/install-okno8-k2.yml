name: Install OKNO 8 Kafel 2 LIVE

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.event.head_commit.message == 'BOOTSTRAP OKNO8 K2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index surgically
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def once(old,new,label):
              global s
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label} anchor count={n}, expected 1')
              s=s.replace(old,new,1)
          if 'OKNO_8_KAFEL_2_LIST_PREZESA_MASTER_CLEAN.png?v=20260906partner8k2master1' in s:
              raise SystemExit('OKNO 8 Kafel 2 already installed; aborting duplicate patch')
          css=read('.github/lm_tmp/okno8k2_css.txt')
          html=read('.github/lm_tmp/okno8k2_html.txt')
          refs=read('.github/lm_tmp/okno8k2_refs.txt')
          copy=read('.github/lm_tmp/okno8k2_copy.txt')
          apply=read('.github/lm_tmp/okno8k2_apply.txt')
          css_anchor='.partner-metric-value{display:block;margin-top:4px;color:#62d62f;font-size:12.2px;line-height:1.05;font-weight:900}\n@media(max-width:430px){.partner-heading'
          once(css_anchor,'.partner-metric-value{display:block;margin-top:4px;color:#62d62f;font-size:12.2px;line-height:1.05;font-weight:900}\n'+css+'\n@media(max-width:430px){.partner-heading','CSS')
          end='</div><div class="partner-metric"><span class="partner-metric-label" id="partnerM3L">BIZNES</span><strong class="partner-metric-value" id="partnerM3V">ODPOWIEDZIALNY</strong></div></div></article></div></section>'
          once(end,end[:-len('</div></section>')]+html+'</div></section>','HTML')
          prefix="const partnerHeadA=document.getElementById('partnerHeadA')"
          start=s.find(prefix)
          if start < 0: raise SystemExit('JS refs anchor missing')
          lineend=s.find('\n',start)
          if lineend < 0: raise SystemExit('JS refs line end missing')
          s=s[:lineend+1]+refs+s[lineend+1:]
          once('\nfunction getCopy(table,code){','\n'+copy+'\nfunction getCopy(table,code){','copy table')
          tail='partnerM3L.textContent=pr.labels[2];partnerM3V.textContent=pr.values[2]}'
          once(tail,tail[:-1]+apply+'}','applyLanguage tail')
          required=['id="partnerCard2"','id="presidentDesc"','id="presidentClosing"','OKNO_8_KAFEL_2_LIST_PREZESA_MASTER_CLEAN.png?v=20260906partner8k2master1','const presidentCopy={',"const presidentEyebrow=document.getElementById('presidentEyebrow')",'Leszek Śladkowski']
          for x in required:
              if x not in s: raise SystemExit('Missing required signature: '+x)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript and diff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          if not m: raise SystemExit('script not found')
          Path('/tmp/index-script.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/index-script.js
          git diff --check
          test "$(git diff --name-only)" = "index.html"
      - name: Commit LIVE Kafel 2
        run: |
          git config user.name "L&M Technic Energy Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "OKNO 8 KAFEL 2 — LIST PREZESA LIVE MULTILANGUAGE"
          git push origin main
