name: Install OKNO 8 Kafel 1 LIVE

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.event.head_commit.message == 'BOOTSTRAP CONTACT9 SURGICAL FIX2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch only OKNO 9 LIVE CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* OKNO 9 — SURGICAL ALIGNMENT V2 */'
          if marker in s:
              raise SystemExit('already installed')
          css=r'''

/* OKNO 9 — SURGICAL ALIGNMENT V2 */
.c9-icon{left:5.8%;width:9.2%;height:5.35%;display:grid;place-items:center}
.c9-icon.sales{top:16.35%}.c9-icon.email{top:24.63%}.c9-icon.stock{top:32.82%}
.c9-sales-l{top:15.15%}.c9-sales-v{top:17.45%}.c9-sales-h{top:19.85%}
.c9-email-l{top:23.45%}.c9-email-v{top:25.75%}.c9-email-h{top:28.15%}
.c9-stock-l{top:31.70%}.c9-stock-v{top:34.00%}.c9-stock-h{top:36.40%}
.c9-action{right:5.50%;width:27.05%;height:5.35%;padding:1.5%;align-items:center;justify-content:center}
.c9-sales-btn{top:16.35%}.c9-email-btn{top:24.63%}.c9-stock-btn{top:32.82%}
.c9-company{top:40.60%}.c9-warehouse{top:40.55%}#warehouse9{top:39.60%}
.c9-mini-action{top:56.05%;height:4.60%}.c9-map{left:50.20%;width:20.95%}.c9-route{left:72.50%;width:22.05%}
.c9-hours{top:62.95%}.c9-pickup{top:62.95%}
.c9-store-title{top:74.65%}.c9-store-desc{top:77.15%}.c9-store-btn{right:6.10%;top:75.83%;width:26.75%;height:5.20%}
.c9-trust{top:85.00%}
.c9-footer-brand{top:89.75%}.c9-footer-pellet{top:92.75%}.c9-footer-slogan{top:95.10%}.c9-footer-company{top:91.90%}.c9-footer-copy{top:97.10%}
@media(max-width:365px){.c9-row-label{font-size:6.3px}.c9-row-value{font-size:11.3px}.c9-row-hint{font-size:5.2px}.c9-action{font-size:7px}.c9-mini-action{font-size:5.6px}.c9-store-btn{font-size:7px}}
'''
          if 'OKNO_9_KONTAKT_MASTER_CLEAN.png' not in s or 'id="contact9"' not in s:
              raise SystemExit('OKNO 9 missing')
          s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          if not m: raise SystemExit('script missing')
          Path('/tmp/script.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/script.js
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          git config user.name "L&M Technic Energy Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "OKNO 9 — CHIRURGICZNE DOPASOWANIE LIVE CSS V2"
          git push origin main
